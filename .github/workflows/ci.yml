name: CI

on:
  workflow_call:
  push:
    branches: ["main", "dev", "claude/**", "feat/**", "codex/**"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff) + type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff mypy PySide6

      - name: Ruff (blocking — real bugs only, configured in pyproject.toml)
        run: ruff check .

      - name: Ruff full report (informational)
        run: ruff check . --select=ALL --statistics || true

      - name: Mypy (informational)
        run: mypy src || true

      - name: Critical contracts (blocking)
        run: mypy --python-version 3.13 --check-untyped-defs --follow-imports=silent src/extractor360/ui/workers.py src/extractor360/core/validation.py src/extractor360/core/output_plan.py src/extractor360/core/reconstruction.py

      # Cheap guard against the recurring release-metadata drift (version.py vs
      # pyproject vs CHANGELOG). No tag here — that part is checked in release.yml.
      - name: Release consistency (version.py <-> pyproject <-> CHANGELOG)
        run: python scripts/check_release.py

  test:
    # This is a cross-platform desktop tool; only Linux was ever tested.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Lightweight subset: enough to import the tested modules without the
        # heavy GPU stack (torch/ultralytics) or the Qt/GUI layer.
        # opencv-python-headless avoids needing system OpenGL libraries.
        # piexif/Pillow are needed to import core.telemetry (EXIF writer).
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "opencv-python-headless>=4.8.0" defusedxml pytest piexif Pillow

      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_studio_ui.py --ignore=tests/test_gui_lifecycle.py --ignore=tests/test_preview_parity.py

  gui:
    name: Studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless defusedxml pytest piexif Pillow PySide6
      - run: python -m pytest tests/test_studio_ui.py tests/test_gui_lifecycle.py tests/test_preview_parity.py -v
